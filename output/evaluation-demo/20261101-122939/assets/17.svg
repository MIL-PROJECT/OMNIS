<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>차별성의 범위와 비교 조건</title><desc>OMNIS 기술 평가 발표. 설계 평가 · 효과 실증 예정</desc>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F2F4F8" stroke="none" stroke-width="2"/>
<text x="80" y="69" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="700" fill="#232E6B">OMNIS</text>
<text x="255" y="69" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="500" fill="#64708A">04 / 세 가지 설계 차별성</text>
<rect x="1390" y="35" width="360" height="44" rx="22" fill="#E9F6F1" stroke="none" stroke-width="2"/>
<text x="1406" y="63" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="600" fill="#147F73">설계 평가 · 효과 실증 예정</text>
<text x="1785" y="68" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="400" fill="#64708A">17 / 30</text>
<text x="80" y="170" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="52" font-weight="700" fill="#232E6B">차별성의 범위와 비교 조건</text>
<polyline points="80,210 1840,210" fill="none" stroke="#DCE2ED" stroke-width="2" stroke-linejoin="round"/>
<rect x="80" y="292" width="568" height="440" rx="20" fill="#FFFFFF" stroke="#DCE2ED" stroke-width="2"/>
<rect x="104" y="320" width="7" height="38" rx="3" fill="#232E6B" stroke="none" stroke-width="2"/>
<text x="128" y="350" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700" fill="#232E6B">기술 원칙</text>
<text x="112" y="420" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="29" font-weight="400" fill="#64708A">일반적으로 쓰이는 패턴</text>
<rect x="676" y="292" width="568" height="440" rx="20" fill="#FFFFFF" stroke="#DCE2ED" stroke-width="2"/>
<rect x="700" y="320" width="7" height="38" rx="3" fill="#232E6B" stroke="none" stroke-width="2"/>
<text x="724" y="350" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700" fill="#232E6B">설계 차별성</text>
<text x="708" y="420" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="29" font-weight="400" fill="#64708A">운용 제약 안의 업무 결합</text>
<rect x="1272" y="292" width="568" height="440" rx="20" fill="#FFFFFF" stroke="#DCE2ED" stroke-width="2"/>
<rect x="1296" y="320" width="7" height="38" rx="3" fill="#232E6B" stroke="none" stroke-width="2"/>
<text x="1320" y="350" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700" fill="#232E6B">효과 검증</text>
<text x="1304" y="420" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="29" font-weight="400" fill="#64708A">동일 과업·동일 기준 비교</text>
<rect x="80" y="785" width="1760" height="84" rx="20" fill="#EBEFFA" stroke="none" stroke-width="2"/>
<text x="113" y="839" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="29" font-weight="500" fill="#232E6B">주장마다 구현 근거와 검증 범위, 적용 조건을 함께 제시합니다.</text>
<text x="80" y="942" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="400" fill="#64708A">특정 상용 제품의 기능 부재·성능 우위를 주장하지 않음</text>
<rect x="0" y="962" width="1920" height="118" rx="0" fill="#15203F" stroke="none" stroke-width="2"/>
</svg>