<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>다음 단계는 조건을 통과하며 확장합니다</title><desc>OMNIS 기술 평가 발표. 개발·실증 로드맵</desc>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F2F4F8" stroke="none" stroke-width="2"/>
<text x="80" y="69" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="700" fill="#232E6B">OMNIS</text>
<text x="255" y="69" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="500" fill="#64708A">08 / 로드맵과 결론</text>
<rect x="1390" y="35" width="360" height="44" rx="22" fill="#E9F6F1" stroke="none" stroke-width="2"/>
<text x="1406" y="63" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="600" fill="#147F73">개발·실증 로드맵</text>
<text x="1785" y="68" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="400" fill="#64708A">29 / 30</text>
<text x="80" y="170" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="52" font-weight="700" fill="#232E6B">다음 단계는 조건을 통과하며 확장합니다</text>
<polyline points="80,210 1840,210" fill="none" stroke="#DCE2ED" stroke-width="2" stroke-linejoin="round"/>
<rect x="80" y="330" width="404" height="275" rx="20" fill="#FFFFFF" stroke="#A86618" stroke-width="2" stroke-dasharray="12 8"/>
<rect x="104" y="358" width="7" height="38" rx="3" fill="#A86618" stroke="none" stroke-width="2"/>
<text x="128" y="384" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" fill="#A86618">현장 과업 실증</text>
<text x="112" y="458" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="29" font-weight="400" fill="#64708A">기록 품질·사용성 확인</text>
<rect x="108" y="539" width="90" height="44" rx="22" fill="#FFF3E3" stroke="none" stroke-width="2"/>
<text x="124" y="567" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="600" fill="#A86618">01</text>
<polyline points="492,469 523,469" fill="none" stroke="#A86618" stroke-width="4" stroke-linejoin="round" stroke-dasharray="12 10"/>
<polygon points="523,469 509.8362615716444,476.19138307906303 509.8362615716444,461.80861692093697" fill="#A86618"/>
<rect x="532" y="330" width="404" height="275" rx="20" fill="#FFFFFF" stroke="#A86618" stroke-width="2" stroke-dasharray="12 8"/>
<rect x="556" y="358" width="7" height="38" rx="3" fill="#A86618" stroke="none" stroke-width="2"/>
<text x="580" y="384" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" fill="#A86618">업무 경계 정리</text>
<text x="564" y="458" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="29" font-weight="400" fill="#64708A">데이터 책임·계약 정리</text>
<rect x="560" y="539" width="90" height="44" rx="22" fill="#FFF3E3" stroke="none" stroke-width="2"/>
<text x="576" y="567" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="600" fill="#A86618">02</text>
<polyline points="944,469 975,469" fill="none" stroke="#A86618" stroke-width="4" stroke-linejoin="round" stroke-dasharray="12 10"/>
<polygon points="975,469 961.8362615716444,476.19138307906303 961.8362615716444,461.80861692093697" fill="#A86618"/>
<rect x="984" y="330" width="404" height="275" rx="20" fill="#FFFFFF" stroke="#A86618" stroke-width="2" stroke-dasharray="12 8"/>
<rect x="1008" y="358" width="7" height="38" rx="3" fill="#A86618" stroke="none" stroke-width="2"/>
<text x="1032" y="384" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" fill="#A86618">제한적 파일 연동</text>
<text x="1016" y="458" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="29" font-weight="400" fill="#64708A">검증·승인·재처리 통과</text>
<rect x="1012" y="539" width="90" height="44" rx="22" fill="#FFF3E3" stroke="none" stroke-width="2"/>
<text x="1028" y="567" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="600" fill="#A86618">03</text>
<polyline points="1396,469 1427,469" fill="none" stroke="#A86618" stroke-width="4" stroke-linejoin="round" stroke-dasharray="12 10"/>
<polygon points="1427,469 1413.8362615716444,476.19138307906303 1413.8362615716444,461.80861692093697" fill="#A86618"/>
<rect x="1436" y="330" width="404" height="275" rx="20" fill="#FFFFFF" stroke="#A86618" stroke-width="2" stroke-dasharray="12 8"/>
<rect x="1460" y="358" width="7" height="38" rx="3" fill="#A86618" stroke="none" stroke-width="2"/>
<text x="1484" y="384" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" fill="#A86618">필요 시 중앙화</text>
<text x="1468" y="458" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="29" font-weight="400" fill="#64708A">인증·동시성·복구 검증</text>
<rect x="1464" y="539" width="90" height="44" rx="22" fill="#FFF3E3" stroke="none" stroke-width="2"/>
<text x="1480" y="567" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="600" fill="#A86618">04</text>
<text x="80" y="832" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="35" font-weight="600" fill="#232E6B">필요성이 확인된 확장부터, 단계별 시험을 통과하며 진행합니다.</text>
<text x="80" y="942" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="400" fill="#64708A">운용 필요성과 검증 결과를 단계별 진입 조건으로 사용</text>
<rect x="0" y="962" width="1920" height="118" rx="0" fill="#15203F" stroke="none" stroke-width="2"/>
</svg>