<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>여러 PC 운용에는 새로운 구조가 필요합니다</title><desc>OMNIS 기술 평가 발표. 현재 한계 + 구조 확장안</desc>
