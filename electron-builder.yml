appId: com.demo.omnis.desktop
productName: OMNIS
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/db/omnis-seed.db
    to: db/omnis-seed.db
asarUnpack:
  - node_modules/better-sqlite3/**/*
win:
  icon: build/icon.svg
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
